asyncapi: 3.1.0
info:
  title: ShiroSU WebSocket 接口
  version: 1.0.0
  description: |
    `suu man --server` 运行服务所提供的 WebSocket 接口

    所有 WebSocket 路径与其对应的 HTTP 路径相同

    需要先通过 HTTP 请求 `POST /ws` 获取临时一次性票证，
    再使用 `?ws={ticket}` 建立 WebSocket 连接

servers:
  superuser:
    host: '{host}:{port}'
    protocol: ws
    pathname: /api/v1/superuser
    description: ShiroSU 后端的本地或局域网地址
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '5355'
    security:
      - $ref: '#/components/securitySchemes/wsTicket'

channels:
  statusVersion:
    address: /status/version
    title: 版本心跳
    summary: 每秒发送一次当前版本号，用于连接存活判断
    description: 服务端每秒发送一条版本号文本信息
    messages:
      version:
        $ref: '#/components/messages/VersionText'
  moduleAction:
    address: /modules/id/{mid}/action
    title: 模块 `action.sh` 执行流
    summary: 执行模块 `action.sh` 并转发标准输入输出与错误
    description: |
      建立连接后后端执行模块的 `action.sh`

      客户端可以发送文本信息作为进程标准输入

      服务端以 JSON 文本信息返回标准输出、标准错误和退出状态
    parameters:
      mid:
        $ref: '#/components/parameters/ModuleId'
    messages:
      stdio:
        $ref: '#/components/messages/WsioStdio'
      exit:
        $ref: '#/components/messages/WsioExit'
operations:
  receiveStatusVersion:
    action: receive
    title: 接收版本心跳
    summary: 每秒接收一次当前版本号文本
    channel:
      $ref: '#/channels/statusVersion'
    messages:
      - $ref: '#/components/messages/VersionText'
  runModuleAction:
    action: receive
    title: 接收模块 `action.sh` 输出
    summary: 接收模块 `action.sh` 的标准输出、标准错误和退出状态
    channel:
      $ref: '#/channels/moduleAction'
    messages:
      - $ref: '#/components/messages/WsioStdio'
      - $ref: '#/components/messages/WsioExit'
  sendModuleActionInput:
    action: send
    title: 发送模块 `action.sh` 输入
    summary: 向模块 `action.sh` 进程标准输入写入数据
    channel:
      $ref: '#/channels/moduleAction'
    messages:
      - $ref: '#/components/messages/WsioInputText'
      - $ref: '#/components/messages/WsioInputBinary'
components:
  securitySchemes:
    wsTicket:
      type: apiKey
      in: query
      name: ws
      description: 通过 HTTP 请求 `POST /ws` 返回的一次性票证
  parameters:
    ModuleId:
      description: 模块 ID
      schema:
        type: string
  messages:
    VersionText:
      name: version
      title: 版本号文本消息
      summary: 当前运行的 ShiroSU 版本
      contentType: text/plain
      payload:
        type: string
        examples:
          - 0.0.0-indev
    WsioInputText:
      name: input_text
      title: 标准输入文本
      summary: 写入进程标准输入的文本消息
      contentType: text/plain
      payload:
        type: string
    WsioInputBinary:
      name: input_binary
      title: 标准输入二进制
      summary: 写入进程标准输入的二进制消息
      contentType: application/octet-stream
      payload:
        type: string
        format: binary
    WsioStdio:
      name: stdio
      title: 标准输出或标准错误消息
      summary: action 进程输出
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WsioStdioMessage'
    WsioExit:
      name: exit
      title: 退出状态消息
      summary: action 进程退出状态
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WsioExitMessage'
  schemas:
    WsioStdioMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: stdio
        stdout:
          type: string
        stderr:
          type: string
    WsioExitMessage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: exit
        code:
          type: integer
        signal:
          type: integer