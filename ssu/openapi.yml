openapi: 3.1.0
info:
  title: ShiroSU HTTP 接口
  version: 1.0.0
  description: |
    `suu man --server` 运行服务所提供的 HTTP 接口

    所有 HTTP 和 WebSocket 路由均以 `/api/v1/superuser` 作为根路径

    所有 HTTP 请求都通过 `Authorization` 请求头校验，
    所有 WebSocket 连接通过 `ws` 查询参数校验，临时一次性票证由 HTTP 请求 `POST /ws` 获取

    所有路径除了部分 `PUT`/`DELETE` 方法之外，任何请求都不会返回 `404`，
    返回 `404` 即说明请求的路径不存在也就是功能不支持/版本过时

servers:
  - url: http://{host}:{port}/api/v1/superuser
    description: ShiroSU 后端的本地或局域网地址
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '5355'

security:
  - bearerAuth: []

tags:
  - name: 兼容
  - name: WebSocket
  - name: 状态
  - name: 配置
  - name: 系统
  - name: 主题
  - name: 软件包

paths:
  /version:
    get:
      tags:
        - 兼容
      operationId: redirectVersion
      summary: 重定向到当前版本接口
      description: |
        永久重定向到 `/status/version`

        建议首次连接时以此路径确认
      responses:
        '308':
          description: 永久重定向到 `/status/version`
          headers:
            Location:
              description: 重定向目标
              schema:
                type: string
                const: /api/v1/superuser/status/version
        '403':
          $ref: '#/components/responses/Forbidden'

  /ws:
    post:
      tags:
        - WebSocket
      operationId: createWebSocketTicket
      summary: 创建一次性 WebSocket 票证
      description: 返回临时票证，用作 WebSocket 升级请求中的 `ws` 查询参数
      responses:
        '200':
          description: 一次性 WebSocket 票证
          content:
            application/json:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /status/version:
    get:
      tags:
        - 状态
        - WebSocket
      operationId: getVersionStatus
      summary: 获取当前运行的 ShiroSU 版本
      description: |
        返回当前 ShiroSU 版本号

        本路径也支持 WebSocket 升级
      x-websocket: true
      parameters:
        - name: ws
          in: query
          required: false
          description: 一次性 WebSocket 票证，仅用于 WebSocket 升级
          schema:
            type: string
      responses:
        '200':
          description: 当前运行版本号
          content:
            application/json:
              schema:
                type: string
        '400':
          description: WebSocket 升级请求无效
        '403':
          $ref: '#/components/responses/Forbidden'

  /status/late-load:
    get:
      tags:
        - 状态
      operationId: getLateLoadStatus
      summary: 检查是否处于越狱模式
      responses:
        '204':
          description: 当前处于越狱模式
        '409':
          description: 当前不处于越狱模式
        '403':
          $ref: '#/components/responses/Forbidden'

  /status/restart:
    post:
      tags:
        - 状态
      operationId: restartManager
      summary: 重启管理后端
      description: |
        请求后端重启监听服务

        应在前端修改 端口/IP 成功后调用，调用后应该刷新页面
      responses:
        '204':
          description: 已请求重启
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - 状态
      operationId: hotUpdateManager
      summary: 热更新并重启管理后端
      description: |
        接收替换用的 `suu` ELF 可执行，校验签名和版本后写入临时路径并执行热重载

        如果请求体为空，后端会从 `url` 查询参数下载 `suu`

        前端调用后应该刷新页面
      parameters:
        - name: url
          in: query
          required: false
          description: 可选 `suu` 下载地址，仅启用完整功能的后端支持
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/x-elf:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: 已接受热更新
        '400':
          description: 未提供 `suu`、下载地址无效或下载结果为空、签名无效、`suu` 文件无效或版本低于当前版本
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 请求体过大
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          description: 当前后端不支持从 `url` 下载
        '502':
          description: 下载 `suu` 下载失败

  /config/password:
    get:
      tags:
        - 配置
      operationId: getPasswordStatus
      summary: 检查密码状态
      responses:
        '204':
          description: 已设置自定义密码
        '409':
          description: 正在使用默认密码
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - 配置
      operationId: updatePassword
      summary: 修改管理密码
      description: 修改管理密码，修改后立即生效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              minLength: 1
      responses:
        '204':
          description: 密码已修改
        '400':
          description: 新密码为空
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /config/ip:
    get:
      tags:
        - 配置
      operationId: getListenIp
      summary: 获取监听 IP
      responses:
        '200':
          description: 当前监听 IP
          content:
            application/json:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - 配置
      operationId: updateListenIp
      summary: 修改监听 IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '204':
          description: 监听 IP 已修改
        '400':
          description: IP 地址无效
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /config/port:
    get:
      tags:
        - 配置
      operationId: getListenPort
      summary: 获取监听端口
      responses:
        '200':
          description: 当前监听端口
          content:
            application/json:
              schema:
                type: integer
                minimum: 1024
                maximum: 49151
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - 配置
      operationId: updateListenPort
      summary: 修改监听端口
      description: 修改监听端口，修改时会检测可用性
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: integer
              minimum: 1024
              maximum: 49151
      responses:
        '204':
          description: 监听端口已修改
        '400':
          description: 端口不在支持范围内
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 端口无法绑定
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/selinux:
    get:
      tags:
        - 系统
      operationId: getSelinuxStatus
      summary: 获取 SELinux 模式
      responses:
        '204':
          description: SELinux 处于强制模式
        '409':
          description: SELinux 处于宽容模式
        '410':
          description: 内核不支持或未启用 SELinux
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/reboot:
    post:
      tags:
        - 系统
      operationId: rebootDevice
      summary: 重启或关闭设备
      description: 前端调用后应该刷新页面
      parameters:
        - name: shutdown
          in: query
          required: false
          description: 查询参数中包含 `shutdown` 时请求关机，否则请求重启
          schema:
            type: string
      responses:
        '204':
          description: 已请求执行电源操作
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/reboot/{cmd}:
    post:
      tags:
        - 系统
      operationId: rebootDeviceCommand
      summary: 重启到指定模式
      description: 前端调用后应该刷新页面
      parameters:
        - name: cmd
          in: path
          required: true
          description: 要重启到的模式
          schema:
            type: string
      responses:
        '204':
          description: 已请求执行指定重启命令
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/boot:
    post:
      tags:
        - 系统
      operationId: readBootImage
      summary: 读取当前槽位的 `init_boot` 或 `boot` 分区镜像
      description: 优先读取 `init_boot{slot}`，不存在时读取 `boot{slot}`，`{slot}` 可能为空
      responses:
        '200':
          description: 原始分区镜像
          content:
            application/x-raw-disk-image:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到支持的启动分区
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - 系统
      operationId: flashBootImage
      summary: 写入镜像到当前槽位的 `init_boot` 或 `boot` 分区
      description: |
        写入提供的镜像，并用零填充目标分区剩余空间

        如果请求体为空，后端会从 `url` 查询参数下载镜像
      parameters:
        - name: url
          in: query
          required: false
          description: 可选镜像下载地址，仅启用完整功能的后端支持
          schema:
            type: string
            format: uri
      requestBody:
        required: false
        content:
          application/x-raw-disk-image:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: 镜像已写入
        '400':
          description: 未提供镜像、下载地址无效或下载结果为空
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到支持的启动分区
        '413':
          description: 镜像大小大于分区大小
        '500':
          $ref: '#/components/responses/InternalServerError'
        '501':
          description: 当前后端不支持从 `url` 下载
        '502':
          description: 下载镜像下载失败

  /theme/wallpaper:
    post:
      tags:
        - 主题
      operationId: readWallpaper
      summary: 读取用户 `0` 的系统壁纸
      description: 优先壁纸裁剪图，其次原图或锁屏壁纸
      responses:
        '200':
          description: 壁纸图片
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到壁纸
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages:
    get:
      tags:
        - 软件包
      operationId: getPackageCount
      summary: 获取软件包 UID 总数
      responses:
        '200':
          description: 软件包 UID 总数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - 软件包
      operationId: listPackages
      summary: 获取软件包 UID 列表
      description: |
        已授权或隐藏软件优先置顶，支持分页拉取

        支持分页拉取，查询参数中不添加 `limit` 即返回 `offset` 后的全部

        可能包含软件名称、图标、系统应用标记
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 以 UID 字符串为键的软件包 UID 分组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{type}:
    get:
      tags:
        - 软件包
      operationId: getPowerPackageCount
      summary: 获取授权或隐藏列表的条目数量
      parameters:
        - $ref: '#/components/parameters/PackageListType'
      responses:
        '200':
          description: 已授权或隐藏条目数量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - 软件包
      operationId: listPowerPackages
      summary: 获取授权或隐藏列表
      description: 不会包含软件名称、图标、系统应用标记
      parameters:
        - $ref: '#/components/parameters/PackageListType'
      responses:
        '200':
          description: 以 UID 字符串为键的授权或隐藏 UID 分组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PowerListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{type}/{uid}:
    put:
      tags:
        - 软件包
      operationId: putPowerPackage
      summary: 将 UID 分组加入授权或隐藏列表
      parameters:
        - $ref: '#/components/parameters/PackageListType'
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: 已保存
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 不存在该 UID
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - 软件包
      operationId: deletePowerPackage
      summary: 从授权或隐藏列表移除 UID 分组
      parameters:
        - $ref: '#/components/parameters/PackageListType'
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: 已移除
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        后端管理密码

        同时支持 `Authorization: Bearer <password>` 和 `Authorization: <password>`
  parameters:
    PackageListType:
      name: type
      in: path
      required: true
      description: 目标列表类型
      schema:
        type: string
        enum:
          - grant
          - hide
    Uid:
      name: uid
      in: path
      required: true
      description: 应用 UID
      schema:
        type: integer
        format: uint32
        minimum: 0
  schemas:
    CountResponse:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          minimum: 0
    AppConfig:
      type: object
      required:
        - packages
        - users
      properties:
        packages:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: integer
            format: uint32
            minimum: 0
    PackageListEntry:
      allOf:
        - $ref: '#/components/schemas/AppConfig'
        - type: object
          properties:
            names:
              type: array
              items:
                type: string
                description: 与 packages 一一对应的软件名称
            icons:
              type: array
              items:
                type: string
                description: |
                  与 packages 一一对应的 base64 编码后的图片字符串

                  字符串已添加类型前缀
            system:
              type: boolean
            grant:
              type: boolean
            hide:
              type: boolean
    PackageListResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/PackageListEntry'
    PowerListResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/AppConfig'
  responses:
    Forbidden:
      description: 鉴权失败，或 WebSocket 票证无效
    InternalServerError:
      description: 后端执行操作失败