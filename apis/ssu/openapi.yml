openapi: 3.1.0
info:
  title: ShiroSU HTTP 接口
  version: 1.0.0
  description: |
    `suu man --server` 运行服务所提供的 HTTP 接口

    所有 HTTP 和 WebSocket 路由均以 `/api/v1/superuser` 作为根路径

    所有 HTTP 请求都通过 `Authorization` 请求头校验，
    所有 WebSocket 连接通过 `ws` 查询参数校验，临时一次性票证由 HTTP 请求 `POST /ws` 获取

    所有路径除了部分 `PUT`/`DELETE` 方法之外，任何请求都不会返回 `404`，
    返回 `404` 即说明请求的路径不存在也就是功能不支持/版本过时

servers:
  - url: http://{host}:{port}/api/v1/superuser
    description: ShiroSU 后端的本地或局域网地址
    variables:
      host:
        default: 127.0.0.1
      port:
        default: '5355'

security:
  - bearerAuth: []

tags:
  - name: WebSocket
  - name: 状态
  - name: 配置
  - name: 系统
  - name: 主题
  - name: 软件包
  - name: 模块

paths:
  /version:
    get:
      tags:
        - 状态
        - WebSocket
      operationId: getVersion
      summary: 获取当前运行的 ShiroSU 版本
      description: |
        普通 HTTP 请求返回当前 ShiroSU 版本号

        本路径也支持 WebSocket 升级
      x-websocket: true
      parameters:
        - $ref: '#/components/parameters/WebSocketTicket'
      responses:
        '200':
          description: 当前运行版本号
          content:
            application/json:
              schema:
                type: string
        '400':
          description: WebSocket 升级请求无效
        '403':
          $ref: '#/components/responses/Forbidden'

  /ws:
    post:
      tags:
        - WebSocket
      operationId: createWebSocketTicket
      summary: 创建一次性 WebSocket 票证
      description: 返回临时票证，用作 WebSocket 升级请求中的 `ws` 查询参数
      responses:
        '200':
          description: 一次性 WebSocket 票证
          content:
            application/json:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /status:
    get:
      tags:
        - 状态
      operationId: getStatus
      summary: 获取运行状态
      responses:
        '200':
          description: 运行状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - lateLoad
                properties:
                  version:
                    type: string
                  lateLoad:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'

  /status/restart:
    post:
      tags:
        - 状态
      operationId: restartManager
      summary: 重启管理后端
      description: 应在修改端口或 IP 成功后调用，调用后前端应该刷新页面
      responses:
        '204':
          description: 已请求重启
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - 状态
      operationId: hotUpdateManager
      summary: 临时热更新并重启管理后端
      description: |
        接收替换用的 `suu` ELF 可执行文件，校验签名和版本后写入临时路径并执行热重载

        仅用于临时更新 ShiroSU，设备重启后仍会变成旧版本

        如果请求体为空，后端会从 `url` 查询参数下载 `suu`

        前端调用后应该刷新页面
      parameters:
        - $ref: '#/components/parameters/DownloadUrl'
      requestBody:
        required: false
        content:
          application/x-elf:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: 已接受热更新并将在后台执行热重载
        '400':
          $ref: '#/components/responses/DownloadBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/DownloadPayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /config:
    get:
      tags:
        - 配置
      operationId: getConfig
      summary: 获取管理配置
      responses:
        '200':
          description: 管理配置
          content:
            application/json:
              schema:
                type: object
                required:
                  - password
                  - ip
                  - port
                properties:
                  password:
                    type: boolean
                  ip:
                    type: string
                    format: ip
                  port:
                    type: integer
                    minimum: 1024
                    maximum: 49151
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - 配置
      operationId: updateConfig
      summary: 修改管理配置
      description: 可同时修改管理密码、监听 IP 和监听端口
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 1
                ip:
                  type: string
                  format: ip
                port:
                  type: integer
                  minimum: 1024
                  maximum: 49151
      responses:
        '204':
          description: 配置已修改
        '400':
          description: 新密码为空
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 端口无法绑定
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system:
    get:
      tags:
        - 系统
      operationId: getSystemInfo
      summary: 获取系统信息
      responses:
        '200':
          description: 系统信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - kernel
                  - arch
                  - system
                  - selinux
                properties:
                  kernel:
                    type: string
                  arch:
                    type: string
                  system:
                    type: string
                  selinux:
                    oneOf:
                      - type: boolean
                      - type: 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/reboot:
    post:
      tags:
        - 系统
      operationId: rebootDevice
      summary: 重启或关闭设备
      description: 前端调用后应该刷新页面
      parameters:
        - name: shutdown
          in: query
          required: false
          description: 查询参数中包含 `shutdown` 时请求关机，否则请求重启
          schema:
            type: string
      responses:
        '202':
          description: 已请求执行电源操作
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/reboot/{cmd}:
    post:
      tags:
        - 系统
      operationId: rebootDeviceCommand
      summary: 重启到指定模式
      description: 前端调用后应该刷新页面
      parameters:
        - name: cmd
          in: path
          required: true
          description: 要重启到的模式
          schema:
            type: string
      responses:
        '202':
          description: 已请求执行指定重启命令
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /system/boot:
    post:
      tags:
        - 系统
      operationId: readBootImage
      summary: 读取当前槽位的 init_boot 或 boot 分区镜像
      description: 优先读取 `init_boot{slot}`，不存在时读取 `boot{slot}`，`{slot}` 可能为空
      responses:
        '200':
          description: 原始分区镜像
          headers:
            Content-Disposition:
              description: 当前槽位分区镜像下载文件名
              schema:
                type: string
                example: attachment; filename="boot_a.img"
            Content-Length:
              description: 分区镜像字节数
              schema:
                type: integer
                minimum: 1
          content:
            application/x-raw-disk-image:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到支持的启动分区
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - 系统
      operationId: flashBootImage
      summary: 写入镜像到当前槽位的 init_boot 或 boot 分区
      description: |
        写入提供的镜像，并用零填充目标分区剩余空间

        如果请求体为空，后端会从 `url` 查询参数下载镜像
      parameters:
        - $ref: '#/components/parameters/DownloadUrl'
      requestBody:
        required: false
        content:
          application/x-raw-disk-image:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: 镜像已写入
        '400':
          $ref: '#/components/responses/DownloadBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到支持的启动分区
        '413':
          $ref: '#/components/responses/DownloadPayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /theme/wallpaper:
    post:
      tags:
        - 主题
      operationId: readWallpaper
      summary: 读取用户 0 的系统壁纸
      description: 优先壁纸裁剪图，其次原图或锁屏壁纸
      responses:
        '200':
          description: 壁纸图片
          headers:
            Content-Length:
              description: 壁纸图片字节数
              schema:
                type: integer
                minimum: 1
          content:
            image/*:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 未找到壁纸

  /packages:
    get:
      tags:
        - 软件包
      operationId: getPackageCount
      summary: 获取软件包 UID 总数与授权隐藏数量
      responses:
        '200':
          description: 软件包 UID 总数与授权隐藏数量
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - grant
                  - hide
                properties:
                  total:
                    type: integer
                    minimum: 0
                  grant:
                    type: integer
                    minimum: 0
                  hide:
                    type: integer
                    minimum: 0
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - 软件包
      operationId: listPackages
      summary: 获取软件包 UID 列表
      description: |
        已授权或隐藏软件优先置顶

        支持分页拉取，查询参数中不添加 `limit` 即返回 `offset` 后的全部

        软件包详细信息查询失败时会返回基础列表
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 以 UID 字符串为键的软件包 UID 分组
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  allOf:
                    - type: object
                      required:
                        - packages
                        - users
                      properties:
                        packages:
                          type: array
                          items:
                            type: string
                        users:
                          type: array
                          items:
                            type: integer
                            format: uint32
                            minimum: 0
                    - type: object
                      properties:
                        names:
                          type: array
                          items:
                            type: string
                            description: 与 packages 一一对应的软件名称
                        icons:
                          type: array
                          items:
                            type: string
                            description: 与 packages 一一对应的 base64 编码图片字符串
                        system:
                          type: boolean
                        grant:
                          type: boolean
                        hide:
                          type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /packages/{type}/{uid}:
    put:
      tags:
        - 软件包
      operationId: putPowerPackage
      summary: 将 UID 分组加入授权或隐藏列表
      parameters:
        - $ref: '#/components/parameters/PackageListType'
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: 已保存
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 不存在该 UID
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - 软件包
      operationId: deletePowerPackage
      summary: 从授权或隐藏列表移除 UID 分组
      parameters:
        - $ref: '#/components/parameters/PackageListType'
        - $ref: '#/components/parameters/Uid'
      responses:
        '204':
          description: 已移除
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules:
    get:
      tags:
        - 模块
      operationId: getModuleSystemStatus
      summary: 获取模块系统状态
      responses:
        '200':
          description: 模块系统状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                properties:
                  version:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 模块系统未安装
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - 模块
      operationId: updateModuleSystem
      summary: 更新模块系统
      description: |
        接收 `modinit` ELF 可执行文件，校验签名和版本后执行模块系统初始化

        如果请求体为空，后端会从 `url` 查询参数下载 `modinit`
      parameters:
        - $ref: '#/components/parameters/DownloadUrl'
      requestBody:
        required: false
        content:
          application/x-elf:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: 模块系统已更新
        '400':
          $ref: '#/components/responses/DownloadBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/DownloadPayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /modules/install:
    get:
      tags:
        - 模块
        - WebSocket
      operationId: installModuleWebSocket
      summary: 通过 WebSocket 安装模块
      description: 本路径只支持 WebSocket 升级
      x-websocket: true
      parameters:
        - $ref: '#/components/parameters/DownloadUrl'
      responses:
        '400':
          description: 未通过 WebSocket 方式请求或升级请求无效
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 模块系统未安装
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - 模块
      operationId: installModule
      summary: 安装模块
      description: |
        接收模块 ZIP 并执行模块安装

        如果请求体为空，后端会从 `url` 查询参数下载模块 ZIP
      parameters:
        - $ref: '#/components/parameters/DownloadUrl'
      requestBody:
        required: false
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 安装输出消息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WsioMessage'
        '400':
          $ref: '#/components/responses/DownloadBadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          description: 模块系统未安装
        '413':
          $ref: '#/components/responses/DownloadPayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /modules/list:
    get:
      tags:
        - 模块
      operationId: getModuleCount
      summary: 获取模块数量
      responses:
        '200':
          description: 模块数量
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                properties:
                  total:
                    type: integer
                    minimum: 0
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - 模块
      operationId: listModules
      summary: 获取模块列表
      description: 支持分页拉取，查询参数中不添加 `limit` 即返回 `offset` 后的全部
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 模块列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - info
                    - status
                  properties:
                    info:
                      $ref: '#/components/schemas/ModuleProp'
                    status:
                      type: object
                      required:
                        - disable
                        - remove
                        - update
                        - skipMount
                      properties:
                        disable:
                          type: boolean
                        remove:
                          type: boolean
                        update:
                          type: boolean
                        skipMount:
                          type: boolean
                        systemless:
                          type: boolean
                        action:
                          type: boolean
                        webui:
                          type: boolean
                        zygisk:
                          type: boolean
                        riru:
                          type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/id/{mid}:
    get:
      tags:
        - 模块
      operationId: getModuleById
      summary: 获取单个模块信息
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: 模块信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleProp'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - 模块
      operationId: markModuleRemove
      summary: 标记模块卸载
      description: 创建或覆盖 `remove` 标记文件
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '204':
          description: 已创建卸载标记
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/id/{mid}/update:
    post:
      tags:
        - 模块
      operationId: getModuleUpdate
      summary: 获取模块远程更新信息
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: 远程更新信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  versionCode:
                    type: integer
                    format: uint64
                    minimum: 0
                  zipUrl:
                    type: string
                  changelog:
                    type: string
        '400':
          description: 更新信息下载地址无效或下载结果为空
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '410':
          description: 模块没有更新信息地址
        '413':
          description: 下载内容过大
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /modules/id/{mid}/update/{url}:
    post:
      tags:
        - 模块
      operationId: downloadModuleUpdateAsset
      summary: 下载模块远程更新资源
      description: 下载模块更新信息中的更新包或更新日志
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: url
          in: path
          required: true
          description: 模块更新资源类型
          schema:
            type: string
            enum:
              - changelog
              - zip
      responses:
        '200':
          description: 远程更新资源
          headers:
            Content-Length:
              description: 远程更新资源字节数
              schema:
                type: integer
                minimum: 1
          content:
            application/zip:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
        '400':
          description: 下载地址无效或下载结果为空
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '410':
          description: 模块没有更新信息地址
        '413':
          description: 下载内容过大
        '422':
          description: 更新信息中不存在目标资源地址
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/JvmBadGateway'
        '503':
          $ref: '#/components/responses/JvmUnavailable'

  /modules/id/{mid}/status/{mark}:
    put:
      tags:
        - 模块
      operationId: putModuleMark
      summary: 创建模块标记文件
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ModuleMark'
      responses:
        '201':
          description: 标记文件已创建
        '204':
          description: 标记文件已存在
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - 模块
      operationId: deleteModuleMark
      summary: 删除模块标记文件
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/ModuleMark'
      responses:
        '204':
          description: 标记文件已删除或原本不存在
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/id/{mid}/action:
    get:
      tags:
        - 模块
        - WebSocket
      operationId: runModuleActionWebSocket
      summary: 通过 WebSocket 执行模块 action.sh
      description: 本路径只支持 WebSocket 升级
      x-websocket: true
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - $ref: '#/components/parameters/WebSocketTicket'
      responses:
        '400':
          description: 未通过 WebSocket 方式请求或升级请求无效
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '410':
          description: 模块系统未安装或模块没有 `action.sh`
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - 模块
      operationId: runModuleAction
      summary: 执行模块 action.sh 并返回输出
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: 输出消息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WsioMessage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '410':
          description: 模块系统未安装或模块没有 `action.sh`
        '500':
          $ref: '#/components/responses/InternalServerError'

  /modules/id/{mid}/icons/{icon}:
    get:
      tags:
        - 模块
      operationId: getModuleIcon
      summary: 获取模块图标
      parameters:
        - $ref: '#/components/parameters/ModuleId'
        - name: icon
          in: path
          required: true
          description: 模块图标类型
          schema:
            type: string
            enum:
              - module
              - action
              - webui
      responses:
        '200':
          description: 模块图标
          headers:
            Content-Length:
              description: 模块图标字节数
              schema:
                type: integer
                minimum: 1
          content:
            image/*:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 模块不存在
        '410':
          description: 模块没有该图标
        '415':
          description: 图标文件不是图片
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        后端管理密码

        同时支持 `Authorization: Bearer <password>` 和 `Authorization: <password>`
  parameters:
    WebSocketTicket:
      name: ws
      in: query
      required: false
      description: 一次性 WebSocket 票证，仅用于 WebSocket 升级
      schema:
        type: string
    DownloadUrl:
      name: url
      in: query
      required: false
      description: 可选下载地址，仅请求体为空时使用
      schema:
        type: string
        format: uri
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PackageListType:
      name: type
      in: path
      required: true
      description: 目标列表类型
      schema:
        type: string
        enum:
          - grant
          - hide
    Uid:
      name: uid
      in: path
      required: true
      description: 应用 UID
      schema:
        type: integer
        format: uint32
        minimum: 0
    ModuleId:
      name: mid
      in: path
      required: true
      description: 模块 ID
      schema:
        type: string
    ModuleMark:
      name: mark
      in: path
      required: true
      description: 模块标记类型
      schema:
        type: string
        enum:
          - disable
          - remove
          - skip_mount
  schemas:
    ModuleProp:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
        nameAnsi:
          type: string
        version:
          type: string
        versionAnsi:
          type: string
        versionCode:
          type: integer
          format: uint64
          minimum: 0
        author:
          type: string
        authorAnsi:
          type: string
        description:
          type: string
        descriptionAnsi:
          type: string
        actionDescription:
          type: string
        actionDescriptionAnsi:
          type: string
        metamodule:
          type: boolean
        updateJson:
          type: string
    WsioMessage:
      oneOf:
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: stdio
            stdout:
              type: string
            stderr:
              type: string
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: exit
            code:
              type: integer
              description: 进程退出码或安装前置错误的 HTTP 状态码
            signal:
              type: integer
  responses:
    DownloadBadRequest:
      description: 未提供请求体、请求体读取失败、下载地址无效、下载结果为空、文件无效
    DownloadPayloadTooLarge:
      description: 请求体或下载内容过大
    Forbidden:
      description: 鉴权失败，或 WebSocket 票证无效
    InternalServerError:
      description: 后端执行操作失败
    JvmBadGateway:
      description: JVM 交互失败、下载响应失败、远端返回非成功状态或响应内容无法解析
    JvmUnavailable:
      description: JVM 服务不可用